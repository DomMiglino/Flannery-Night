name = "flannery-night-v2"
main = "src/worker.ts"
compatibility_date = "2026-05-01"

[[d1_databases]]
binding = "DB"
database_name = "flannery-night-v2"
database_id = "102b9aa6-301b-4482-a9a7-e0165c99563d"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
# Le rotte dell'interfaccia (/classifica, /giocatori/:id, ...) non sono file:
# senza questo, ogni percorso diverso da index.html darebbe 404.
not_found_handling = "single-page-application"
# Il Worker gira per primo su OGNI richiesta (anche gli asset): così le
# intestazioni di sicurezza arrivano su tutte le risposte, non solo sulle API.
# Il Worker rimanda agli asset tutto ciò che non è /api/*.
run_worker_first = true
