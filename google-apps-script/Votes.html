<!doctype html>
<html lang="it">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--bg:#0f1713;--panel:#16211b;--panel2:#1d2a23;--text:#f3f7f4;--muted:#9fb0a5;--line:#304238;--green:#43c478;--gold:#e4b85b;--red:#e16969}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{padding:4px 2px 40px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
    .notice{padding:13px 14px;border:1px solid #38584a;background:#173226;border-radius:13px;margin:12px 0}
    .warn{background:#332d1a;border-color:#62552e;color:#f3df9e}
    h2,h3{margin-top:0}.muted{color:var(--muted)}
    label{display:block;font-weight:700;margin-bottom:6px}
    select,input{width:100%;background:#0d1511;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}
    .field{margin-bottom:12px}
    button{border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}
    .primary{background:var(--green);color:#07110b;border-color:var(--green)}
    .secondary{background:var(--panel2);color:var(--text)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .badge{border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:12px}
    .good{color:#8ff0b5;background:#163a26;border-color:#245b3d}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
    #msg{position:fixed;right:14px;bottom:14px;background:#10261a;border:1px solid #2e7049;padding:11px 13px;border-radius:11px;opacity:0;transform:translateY(8px);transition:.2s}
    #msg.show{opacity:1;transform:none}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.attrs{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div class="wrap" id="app"><div class="card">Caricamento…</div></div>
<div id="msg"></div>
<script>
const ATTRS=[['vel_tuf','VEL/TUF'],['tir_pre','TIR/PRE'],['pass_rin','PASS/RIN'],['dri_rif','DRI/RIF'],['dif_rea','DIF/REA'],['fis_pia','FIS/PIA']];
let players=[], session=null, myVotes=new Map();

function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(t){const e=document.getElementById('msg');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
function fail(err){toast((err&&err.message)||'Errore');}
function run(name,args,onSuccess){
  let r=google.script.run.withSuccessHandler(onSuccess).withFailureHandler(fail);
  r[name](...(args||[]));
}
function renderStart(){
  const opts=players.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('');
  document.getElementById('app').innerHTML='<div class="card" style="max-width:620px"><h2>Accesso giocatore</h2><p class="muted">Al primo accesso scegli il tuo PIN personale di 6 cifre. Dagli accessi successivi userai sempre lo stesso PIN.</p><div class="field"><label>Giocatore</label><select id="who"><option value="">Seleziona...</option>'+opts+'</select></div><div id="pinArea"></div></div>';
  document.getElementById('who').onchange=checkPin;
}
function checkPin(){
  const id=document.getElementById('who').value, area=document.getElementById('pinArea');
  if(!id){area.innerHTML='';return}
  area.innerHTML='<div class="muted">Controllo accesso…</div>';
  run('uiPlayerPinStatus',[id],res=>{
    if(res.hasPin){
      area.innerHTML='<div class="field"><label>PIN personale</label><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="6 cifre"></div><button id="login" class="primary">Accedi alle votazioni</button>';
      document.getElementById('login').onclick=login;
    }else{
      area.innerHTML='<div class="notice">Primo accesso: crea ora il tuo PIN personale di <strong>6 cifre</strong>.</div><div class="field"><label>Crea PIN</label><input id="pin1" type="password" inputmode="numeric" maxlength="6"></div><div class="field"><label>Conferma PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="6"></div><button id="create" class="primary">Crea PIN e accedi</button>';
      document.getElementById('create').onclick=createPin;
    }
  });
}
function createPin(){
  const id=document.getElementById('who').value,p1=document.getElementById('pin1').value.trim(),p2=document.getElementById('pin2').value.trim();
  if(!/^\d{6}$/.test(p1)){toast('Il PIN deve avere esattamente 6 cifre');return}
  if(p1!==p2){toast('I PIN non coincidono');return}
  run('uiRegisterPlayerPin',[id,p1],()=>{
    session={id,pin:p1}; myVotes=new Map(); toast('PIN creato'); renderVotes();
  });
}
function login(){
  const id=document.getElementById('who').value,pin=document.getElementById('pin').value.trim();
  if(!/^\d{6}$/.test(pin)){toast('Inserisci 6 cifre');return}
  run('uiLogin',[id,pin],res=>{
    session={id,pin}; players=res.players||players; myVotes=new Map((res.votes||[]).map(v=>[v.target_id,v])); renderVotes();
  });
}
function renderVotes(){
  const me=players.find(p=>p.id===session.id);
  const targets=players.filter(p=>p.id!==session.id).sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById('app').innerHTML='<div class="toolbar"><div><h2 style="margin:0">Votazioni</h2><div class="muted">Accesso come <strong>'+esc(me?me.name:'')+'</strong>. Non puoi votare te stesso.</div></div><button id="logout" class="secondary">Esci</button></div><div class="notice">Valuta ogni giocatore da 1 a 99. Il rating pubblico usa la <strong>mediana</strong> dei voti ricevuti per ogni attributo.</div><div class="grid">'+targets.map(card).join('')+'</div>';
  document.getElementById('logout').onclick=()=>{session=null;myVotes.clear();renderStart()};
  document.querySelectorAll('.save').forEach(b=>b.onclick=()=>save(b.closest('.card')));
}
function card(p){
  const old=myVotes.get(p.id)||{};
  return '<div class="card" data-target="'+esc(p.id)+'"><div class="top"><div><h3 style="margin:0">'+esc(p.name)+'</h3><div class="muted">'+esc(p.role)+'</div></div><span class="badge '+(old.target_id?'good':'')+'">'+(old.target_id?'Votato':'Da votare')+'</span></div><div class="attrs" style="margin-top:12px">'+ATTRS.map(([k,l])=>'<div class="field"><label>'+l+'</label><input data-a="'+k+'" type="number" min="1" max="99" step="1" value="'+(old[k]??'')+'"></div>').join('')+'</div><button class="primary save">Salva voto</button></div>';
}
function save(card){
  const vals={}; let ok=true;
  card.querySelectorAll('[data-a]').forEach(i=>{const n=Number(i.value);if(!Number.isInteger(n)||n<1||n>99)ok=false;vals[i.dataset.a]=n});
  if(!ok){toast('Inserisci tutti i valori da 1 a 99');return}
  const payload={velTuf:vals.vel_tuf,tirPre:vals.tir_pre,passRin:vals.pass_rin,driRif:vals.dri_rif,difRea:vals.dif_rea,fisPia:vals.fis_pia};
  run('uiSubmitVote',[session.id,session.pin,card.dataset.target,payload],()=>{
    myVotes.set(card.dataset.target,{target_id:card.dataset.target,...vals});toast('Voto salvato');renderVotes();
  });
}
run('uiBootstrap',[],res=>{players=res.players||[];renderStart()});
</script>
</body>
</html>
