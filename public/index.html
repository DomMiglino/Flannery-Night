<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#11151c">
<title>Flannery Night</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="salta" href="#contenuto">Salta al contenuto</a>

<header class="testata">
  <div class="testata-riga">
    <h1 class="marchio"><a class="marchio-link" id="titolo-sito" href="/">Flannery Night</a></h1>
    <div class="testata-azioni">
      <span class="stagione-campo" id="stagione-campo" hidden>
        <label class="solo-lettori" for="stagione">Stagione</label>
        <select id="stagione" class="stagione"></select>
      </span>
      <button type="button" id="pulsante-account" class="pulsante-icona" aria-haspopup="true" aria-expanded="false" aria-controls="menu-account">
        <svg class="icona-giocatore" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
        </svg>
        <span class="solo-lettori">Account</span>
      </button>
    </div>
  </div>
  <div id="menu-account" class="menu" hidden>
    <p class="menu-titolo" id="menu-titolo">Account</p>
    <a class="menu-voce" id="voce-cambia" href="/accesso/cambia">Cambia PIN</a>
    <a class="menu-voce" id="voce-accedi" href="/accesso">Accedi</a>
    <button type="button" class="menu-voce menu-esci" id="voce-esci">Esci</button>
  </div>
</header>

<main id="contenuto" class="contenuto" tabindex="-1"></main>

<nav class="barra" aria-label="Sezioni del sito">
  <a class="barra-voce" id="nav-home" href="/home" hidden>
    <svg class="barra-icona" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 11l8-7 8 7"></path>
      <path d="M6.5 9.5V20h11V9.5"></path>
    </svg>
    <span class="barra-etichetta">Home</span>
  </a>
  <a class="barra-voce" id="nav-classifica" href="/classifica">
    <svg class="barra-icona" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 4h10v4a5 5 0 0 1-10 0V4z"></path>
      <path d="M7 5.5H4.5c0 2.8 1.4 4.2 3.2 4.2M17 5.5h2.5c0 2.8-1.4 4.2-3.2 4.2"></path>
      <path d="M12 13.5V17M8.5 20.5h7"></path>
    </svg>
    <span class="barra-etichetta">Classifica</span>
  </a>
  <a class="barra-voce" id="nav-giocatori" href="/giocatori">
    <svg class="barra-icona" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4L4 7.5 6 11l2-1.2V20h8V9.8l2 1.2 2-3.5L15 4a3 3 0 0 1-6 0z"></path>
    </svg>
    <span class="barra-etichetta">Giocatori</span>
  </a>
  <a class="barra-voce" id="nav-partite" href="/partite">
    <svg class="barra-icona" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8"></circle>
      <path d="M12 8.5l3.2 2.3-1.2 3.7h-4l-1.2-3.7z"></path>
      <path d="M12 4v3M5.6 9.2l2.9 1M18.4 9.2l-2.9 1"></path>
    </svg>
    <span class="barra-etichetta">Partite</span>
  </a>
</nav>

<script type="module" src="/js/app.js"></script>
</body>
</html>
